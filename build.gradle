// Top-level build file where you can add configuration options common to all sub-projects/modules.
//apply plugin: 'maven'

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    version = VERSION_NAME
    group = GROUP

    repositories {
        mavenCentral()
        google()
    }
}

android {
    compileSdk 33
    buildTypes {
        release {}
        debug {}
        qa {}
    }
    namespace 'com.lorentzos.flingswipe'
}